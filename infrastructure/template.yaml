AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ecommerce AWS backend with separate Cognito pools for admin and customers

Parameters:
  ProductsTableName:
    Type: String
    Default: EcommerceProducts

  OrdersTableName:
    Type: String
    Default: EcommerceOrders

Resources:
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ecommerce-aws-admin-users

      AliasAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      UsernameConfiguration:
        CaseSensitive: false

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      MfaConfiguration: "OFF"

      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ecommerce-aws-admin-web
      UserPoolId: !Ref AdminUserPool

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      PreventUserExistenceErrors: ENABLED

  # Giữ pool cũ nguyên cấu hình để CloudFormation không cố đổi AliasAttributes.
  # Pool này không dùng cho đăng ký mới.
  CustomerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ecommerce-aws-customer-users

      AliasAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      UsernameConfiguration:
        CaseSensitive: false

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      MfaConfiguration: "OFF"

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CustomerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ecommerce-aws-customer-web
      UserPoolId: !Ref CustomerUserPool

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      PreventUserExistenceErrors: ENABLED

  # Pool mới dùng UsernameAttributes=email để frontend có thể dùng email làm Username khi SignUp.
  CustomerUserPoolV2:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ecommerce-aws-customer-users-v2

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      UsernameConfiguration:
        CaseSensitive: false

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      MfaConfiguration: "OFF"

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CustomerUserPoolClientV2:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ecommerce-aws-customer-web-v2
      UserPoolId: !Ref CustomerUserPoolV2

      GenerateSecret: false

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      PreventUserExistenceErrors: ENABLED

  EcommerceHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod

      Auth:
        Authorizers:
          AdminJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"

            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}"
              audience:
                - !Ref AdminUserPoolClient

          CustomerJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"

            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CustomerUserPoolV2}"
              audience:
                - !Ref CustomerUserPoolClientV2

  EcommerceBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: src/lambda.handler
      Runtime: nodejs22.x

      Architectures:
        - arm64

      MemorySize: 256
      Timeout: 10

      Environment:
        Variables:
          SES_FROM_EMAIL: thinhdaongoc1@gmail.com
          PRODUCTS_TABLE: !Ref ProductsTableName
          ORDERS_TABLE: !Ref OrdersTableName
          PRODUCT_IMAGES_BUCKET: !Ref FrontendBucket
          PRODUCT_IMAGES_BASE_URL: !Sub "https://${FrontendDistribution.DomainName}"
          ZALOPAY_SECRET_ID: ecommerce-aws/zalopay/sandbox
          ZALOPAY_CALLBACK_URL: "https://89yap0gq5k.execute-api.ap-southeast-1.amazonaws.com/prod/payments/zalopay/callback"
          ZALOPAY_REDIRECT_URL: !Sub "https://${FrontendDistribution.DomainName}/checkout/success/"

      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:TransactWriteItems
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProductsTableName}"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProductsTableName}/index/*"
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTableName}"

        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub "${FrontendBucket.Arn}/uploads/products/*"

        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ecommerce-aws/zalopay/sandbox-*"

        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/thinhdaongoc1@gmail.com"

      Events:
        PublicApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref EcommerceHttpApi
            Path: "/{proxy+}"
            Method: ANY

        AdminApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref EcommerceHttpApi
            Path: "/admin/{proxy+}"
            Method: ANY
            Auth:
              Authorizer: AdminJwtAuthorizer

        AdminCorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref EcommerceHttpApi
            Path: "/admin/{proxy+}"
            Method: OPTIONS

        CustomerApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref EcommerceHttpApi
            Path: "/account/{proxy+}"
            Method: ANY
            Auth:
              Authorizer: CustomerJwtAuthorizer

        CustomerCorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref EcommerceHttpApi
            Path: "/account/{proxy+}"
            Method: OPTIONS

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Target: es2020
        Format: cjs
        Sourcemap: true
        Minify: false

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - http://localhost:3000
              - http://127.0.0.1:3000
              - https://dfjng6e5jz4mf.cloudfront.net
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        Description: CloudFront access control for private frontend S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-url-rewrite"
      AutoPublish: true

      FunctionConfig:
        Comment: Rewrite static export routes to index.html
        Runtime: cloudfront-js-2.0

      FunctionCode: |
        async function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.endsWith("/")) {
            request.uri += "index.html";
          } else if (!uri.includes(".")) {
            request.uri += "/index.html";
          }

          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Ecommerce AWS static frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true

        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id

            S3OriginConfig:
              OriginAccessIdentity: ""

        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https

          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS

          CachedMethods:
            - GET
            - HEAD

          Compress: true

          ForwardedValues:
            QueryString: false

            Cookies:
              Forward: none

          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendUrlRewriteFunction.FunctionMetadata.FunctionARN

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket

      PolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Sid: AllowCloudFrontReadOnly

            Effect: Allow

            Principal:
              Service: cloudfront.amazonaws.com

            Action:
              - s3:GetObject

            Resource: !Sub "${FrontendBucket.Arn}/*"

            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${EcommerceHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  AdminUserPoolId:
    Description: Cognito admin user pool ID
    Value: !Ref AdminUserPool

  AdminUserPoolClientId:
    Description: Cognito admin app client ID
    Value: !Ref AdminUserPoolClient

  AdminUserPoolIssuer:
    Description: Cognito JWT issuer URL
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}"

  CustomerUserPoolId:
    Description: Cognito customer user pool ID
    Value: !Ref CustomerUserPoolV2

  CustomerUserPoolClientId:
    Description: Cognito customer app client ID
    Value: !Ref CustomerUserPoolClientV2

  CustomerUserPoolIssuer:
    Description: Cognito customer JWT issuer URL
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CustomerUserPoolV2}"

  FrontendBucketName:
    Description: Private S3 bucket storing the static frontend files
    Value: !Ref FrontendBucket

  FrontendDistributionId:
    Description: CloudFront distribution ID for the frontend
    Value: !Ref FrontendDistribution

  WebsiteUrl:
    Description: Public CloudFront URL for the ecommerce website
    Value: !Sub "https://${FrontendDistribution.DomainName}"
